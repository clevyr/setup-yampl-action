name: Test

on: push

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version:
          - v0.6.1
          - latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./
        id: action
        with:
          version: ${{ matrix.version }}
      - name: Check output
        shell: bash
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          if [[ -n "$VERSION" ]]; then
            echo Got version output: "$VERSION"
          else
            echo Version output was empty
            exit 1
          fi
      - name: Binary exists
        shell: bash
        run: command -v yampl
      - name: Binary runs
        shell: bash
        run: yampl --version
